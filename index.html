<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Moult AI Web - Assistant Intelligent</title>
    
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png">
   <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16x16.png">
    <link rel="manifest" href="images/favicon/site.webmanifest">
    <link rel="shortcut icon" href="images/favicon/favicon.ico">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-area">
                    <div class="logo-icon">
                        <img src="images/logo48.png" alt="Moult AI Web" class="logo-img">
                    </div>
                    <h2>Moult AI Web</h2>
                </div>
                <button class="new-chat-btn" id="newChatBtn">
                    <i class="fas fa-plus"></i>
                    <span>Nouvelle conversation</span>
                </button>
                <button class="import-chat-btn" id="importChatBtn">
                    <i class="fas fa-upload"></i>
                    <span>Importer</span>
                </button>
                <button class="search-btn" id="searchBtn">
                    <i class="fas fa-search"></i>
                    <span>Rechercher</span>
                </button>
                <button class="settings-btn" id="settingsBtn">
                    <i class="fas fa-cog"></i>
                    <span>Paramètres</span>
                </button>
            </div>

            <div class="conversations-list" id="conversationsList"></div>

            <div class="sidebar-footer">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="lang-toggle" id="langToggle">
                    <i class="fas fa-globe"></i>
                    <span>FR</span>
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-content">
            <header class="chat-header">
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="header-info">
                    <div class="provider-badge" id="providerBadge">
                        <i class="fas fa-microchip"></i>
                        <span>OpenRouter</span>
                    </div>
                    <div class="model-selector">
                        <select id="modelSelect">
                            <option value="openrouter">OpenRouter</option>
                            <option value="hf">HuggingFace</option>
                            <option value="groq">GroqCloud</option>
                        </select>
                    </div>
                    <div class="mode-selector">
                        <select id="modeSelect">
                            <option value="default">🤖 Général</option>
                            <option value="coding">💻 Code</option>
                            <option value="creative">🎨 Créatif</option>
                            <option value="concise">⚡ Concis</option>
                        </select>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="clear-chat-btn" id="clearChatBtn">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </header>

            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-content">
                    <div class="static-logo">
                        <div class="logo-icon-center">
                            <img src="images/logo128.png" alt="Moult AI Web">
                        </div>
                    </div>
                    <h1>Moult AI Web</h1>
                    <p class="welcome-subtitle" id="welcomeText">Comment puis-je vous aider aujourd'hui ?</p>
                </div>
            </div>

            <!-- Chat Messages -->
            <div class="chat-messages" id="chatMessages" style="display: none;"></div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-container">
                    <textarea id="userInput" rows="1" placeholder="Tapez votre message..."></textarea>
                    <button id="sendBtn" class="send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="input-footer">
                    <div class="typing-indicator" id="typingIndicator" style="display: none;">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Language Modal -->
    <div id="languageModal" class="modal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h3><i class="fas fa-language"></i> Choisir la langue</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <button class="lang-option" data-lang="fr">🇫🇷 Français</button>
                <button class="lang-option" data-lang="en">🇬🇧 English</button>
                <button class="lang-option" data-lang="es">🇪🇸 Español</button>
                <button class="lang-option" data-lang="de">🇩🇪 Deutsch</button>
                <button class="lang-option" data-lang="it">🇮🇹 Italiano</button>
                <button class="lang-option" data-lang="pt">🇵🇹 Português</button>
                <button class="lang-option" data-lang="ja">🇯🇵 日本語</button>
                <button class="lang-option" data-lang="zh">🇨🇳 中文</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h3><i class="fas fa-cog"></i> Paramètres</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <h4>🎨 Thèmes</h4>
                    <div class="theme-options">
                        <button class="theme-option" data-theme="light">☀️ Clair</button>
                        <button class="theme-option" data-theme="dark">🌙 Sombre</button>
                        <button class="theme-option" data-theme="ocean">🌊 Océan</button>
                        <button class="theme-option" data-theme="forest">🌲 Forêt</button>
                        <button class="theme-option" data-theme="sunset">🌅 Coucher de soleil</button>
                        <button class="theme-option" data-theme="midnight">🌌 Minuit</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h4>📦 Import/Export</h4>
                    <label>Format d'import par défaut :</label>
                    <select id="importFormat">
                        <option value="json">JSON</option>
                        <option value="jsonl">JSONL</option>
                        <option value="alpaca">Alpaca</option>
                    </select>
                    <button id="exportAllBtn" class="settings-action-btn">
                        <i class="fas fa-download"></i> Exporter toutes les conversations
                    </button>
                </div>
                <div class="settings-section">
                    <h4>🔄 Provider</h4>
                    <label>Provider par défaut :</label>
                    <select id="defaultProvider">
                        <option value="openrouter">OpenRouter</option>
                        <option value="hf">HuggingFace</option>
                        <option value="groq">GroqCloud</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Modal -->
    <div id="searchModal" class="modal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h3><i class="fas fa-search"></i> Rechercher dans les conversations</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="searchInput" class="search-input" placeholder="Termes à rechercher...">
                <div class="search-results" id="searchResults"></div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="js/script.js"></script>
    
    <!-- Register Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(reg => {
                console.log('SW registered:', reg);
            }).catch(err => {
                console.log('SW failed:', err);
            });
        }
    </script>
</body>
</html>
